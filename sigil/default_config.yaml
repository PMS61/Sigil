# ─────────────────────────────────────────────────────────────────────────────
# Sigil – Gesture Control Framework for Hyprland
# ─────────────────────────────────────────────────────────────────────────────

log_level: info
overlay: true
daemon: true

overlay_settings:
  position: "bottom-right"
  width: 320
  height: 180
  opacity: 1.0
  camera_preview: true
  margin: 16

tracking:
  num_hands: 2
  min_detection_confidence: 0.7
  min_tracking_confidence: 0.6
  model_asset_path: hand_landmarker.task
  camera_id: 0
  frame_width: 1280
  frame_height: 720
  target_fps: 30
  low_fps_fallback: 15
  zoom: 1.0

execution:
  confirm_frames: 3
  blanking_ms: 1200
  confidence_threshold: 0.75

recording:
  hotkey: "Super+Alt+G"
  samples_per_class: 100
  min_samples: 50
  max_samples: 200

# ═══════════════════════════════════════════════════════════════════════════
#  POWER-USER GESTURES (§5.5)
# ═══════════════════════════════════════════════════════════════════════════
# Hand center MUST be inside the visual "Safe Zone" to trigger.
#
# MediaPipe Built-in Poses:
#   Closed_Fist, Open_Palm, Pointing_Up, Thumb_Up, Thumb_Down, Victory, ILoveYou
# ═══════════════════════════════════════════════════════════════════════════
gestures:
  # ── RIGHT HAND: Window Management & Shell ──────────────────────────────────
  - name: close_window
    type: instant
    hand: right
    condition: { pose: "Closed_Fist" }
    action: "hyprctl dispatch killactive"
    cooldown_ms: 800

  - name: toggle_launcher
    type: instant
    hand: right
    condition: { pose: "Open_Palm" }
    action: "hyprctl dispatch exec qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || fuzzel"
    cooldown_ms: 1000

  - name: workspace_next
    type: instant
    hand: right
    condition: { pose: "Thumb_Up" }
    action: "hyprctl dispatch workspace r+1"
    cooldown_ms: 400

  - name: workspace_prev
    type: instant
    hand: right
    condition: { pose: "Thumb_Down" }
    action: "hyprctl dispatch workspace r-1"
    cooldown_ms: 400

  - name: toggle_maximize
    type: instant
    hand: right
    condition: { pose: "Pointing_Up" }
    action: "hyprctl dispatch fullscreen 1"
    cooldown_ms: 600

  - name: toggle_overview
    type: instant
    hand: right
    condition: { pose: "Victory" }
    action: "hyprctl dispatch global quickshell:overviewWorkspacesToggle"
    cooldown_ms: 800

  - name: lock_session
    type: instant
    hand: right
    condition: { pose: "ILoveYou" }
    action: "hyprctl dispatch exec loginctl lock-session"
    cooldown_ms: 1500

  # ── LEFT HAND: Apps & Media ──────────────────────────────────────────────
  - name: launch_browser
    type: instant
    hand: left
    condition: { pose: "Open_Palm" }
    action: "hyprctl dispatch exec google-chrome-stable || hyprctl dispatch exec firefox"
    cooldown_ms: 1500

  - name: launch_terminal
    type: instant
    hand: left
    condition: { pose: "Closed_Fist" }
    action: "hyprctl dispatch exec kitty"
    cooldown_ms: 1500

  - name: media_play_pause
    type: instant
    hand: left
    condition: { pose: "Pointing_Up" }
    action: "hyprctl dispatch exec playerctl play-pause"
    cooldown_ms: 500

  - name: media_next
    type: instant
    hand: left
    condition: { pose: "Thumb_Up" }
    action: "hyprctl dispatch exec playerctl next"
    cooldown_ms: 400

  - name: media_prev
    type: instant
    hand: left
    condition: { pose: "Thumb_Down" }
    action: "hyprctl dispatch exec playerctl previous"
    cooldown_ms: 400

  # ── GRADUAL: Volume Control ──────────────────────────────────────────────
  - name: volume_up
    type: gradual
    hand: both
    condition:
      feature: "two_hand_distance"
      min_delta: 0.05
      direction: "increase"
    action: "hyprctl dispatch exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5"
    cooldown_ms: 150

  - name: volume_down
    type: gradual
    hand: both
    condition:
      feature: "two_hand_distance"
      min_delta: 0.05
      direction: "decrease"
    action: "hyprctl dispatch exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-"
    cooldown_ms: 150

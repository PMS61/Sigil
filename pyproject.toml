[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil"
version = "1.0.0"
description = "Gesture Control Framework for Hyprland"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Prathamesh"}]
keywords = ["gesture", "hyprland", "mediapipe", "wayland", "hand-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Wayland",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
train = [
    "mediapipe-model-maker>=0.2.1",
    "scikit-learn>=1.4",
    "tensorflow>=2.16",
]
wayland = [
    "PyGObject>=3.42",
    "pycairo>=1.24",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
]

[project.scripts]
sigil = "sigil.__main__:main"

[tool.setuptools.packages.find]
include = ["sigil*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
